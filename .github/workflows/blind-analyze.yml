name: 赛前盲测分析

on:
  schedule:
    # 北京时间 03:00 = UTC 19:00 (赛前3小时)
    - cron: '0 19 * * *'
    # 北京时间 03:45 = UTC 19:45 (赛前15分钟)
    - cron: '45 19 * * *'
  workflow_dispatch:
    inputs:
      match_ids:
        description: '比赛ID列表(逗号分隔)，留空则自动获取今日比赛'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install requests beautifulsoup4 openpyxl

      - name: 更新赛季数据
        run: |
          cd scraper
          python chuqi_pipeline.py --season

      - name: 抓取今日比赛完整数据
        run: |
          cd scraper
          MATCH_IDS="${{ github.event.inputs.match_ids }}"
          if [ -z "$MATCH_IDS" ]; then
            # 从赛季数据获取今日比赛
            python -c "import json; from datetime import datetime, timezone, timedelta; CST=timezone(timedelta(hours=8)); s=json.load(open('../match_data/season_data.json')); today=datetime.now(CST).strftime('%Y-%m-%d'); ids=[str(e['id']) for e in s.get('events',[]) if today in str(e.get('scheduletime',''))] or [str(e['id']) for e in s.get('events',[])][-5:]; print(','.join(ids))" > /tmp/ids.txt
            MATCH_IDS=$(cat /tmp/ids.txt)
          fi
          echo "Match IDs: $MATCH_IDS"
          for mid in $(echo $MATCH_IDS | tr ',' ' '); do
            python chuqi_pipeline.py "$mid"
          done

      - name: 盲测分析+预测
        run: |
          cd scraper
          MATCH_IDS="${{ github.event.inputs.match_ids }}"
          if [ -z "$MATCH_IDS" ] && [ -f /tmp/ids.txt ]; then
            MATCH_IDS=$(cat /tmp/ids.txt)
          fi
          python run_blind_pipeline.py "$MATCH_IDS"

      - name: 提交结果
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add match_data/ data/ 2>/dev/null || true
          git commit -m "Blind analysis $(date -u -d '+8 hours' '+%Y-%m-%d %H:%M') CST" || echo "No changes"
          git push
